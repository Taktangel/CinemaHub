name: Android debug APK

on:
  push:
    branches: [main, feature/media-sources-player-v0.3, feature/tmdb-network-v0.4, fix/demo-playback-v0.4.1, feature/external-player-signing-v0.5, feature/library-favorites-v0.6, feature/catalog-adapters-v0.7, feature/provider-directory-v0.8, feature/aniliberty-player-v0.9, feature/aniliberty-home-resume-v1.0, feature/vlc-watch-progress-v0.11]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure persistent signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.CINEMAHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinemahub-signing.jks"
            echo "CINEMAHUB_KEYSTORE_PATH=$RUNNER_TEMP/cinemahub-signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No persistent signing key configured. This APK may not update existing installs."
          fi

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CINEMAHUB_STORE_PASSWORD: ${{ secrets.CINEMAHUB_STORE_PASSWORD }}
          CINEMAHUB_KEY_ALIAS: ${{ secrets.CINEMAHUB_KEY_ALIAS }}
          CINEMAHUB_KEY_PASSWORD: ${{ secrets.CINEMAHUB_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CinemaHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
